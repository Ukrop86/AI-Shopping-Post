<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Історія постів — Postly</title>
  <link rel="stylesheet" href="/style.css" />
  <link rel="icon" type="image/png" href="/logo-mark.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="topbar-left">
        <div class="logo">
          <img class="logo-icon" src="/logo-mark.png" alt="Postly" width="28" height="28" />
          <span class="logo-name">Postly</span>
        </div>
        <div class="topbar-divider"></div>
        <span class="badge">Історія</span>
      </div>
      <button class="nav-toggle" onclick="document.getElementById('topbarNav').classList.toggle('open')" aria-label="Меню">☰</button>
      <nav class="topbar-nav" id="topbarNav">
        <a href="/instagram.html" class="btn ghost">📸 Instagram</a>
        <a href="/stats.html" class="btn ghost">Статистика</a>
        <a href="/setup.html" class="btn ghost">⚙ Налаштування</a>
        <a href="/app.html" class="btn secondary">+ Новий товар</a>
      </nav>
    </header>

    <div class="page-body">
      <section class="card filters">
        <input
          type="search"
          id="productsSearch"
          placeholder="Пошук за назвою або артикулом..."
        />
        <select id="platformFilter">
          <option value="">Усі платформи</option>
          <option value="telegram">Telegram</option>
          <option value="instagram">Instagram</option>
          <option value="facebook">Facebook</option>
          <option value="shafa">Shafa.ua</option>
        </select>
        <select id="statusFilter">
          <option value="">Усі статуси</option>
          <option value="draft">Чернетка</option>
          <option value="scheduled">Заплановано</option>
          <option value="publishing">Публікується</option>
          <option value="published">Опубліковано</option>
          <option value="failed">Помилка</option>
        </select>
      </section>

      <section class="card bundle-bar" id="bundleBar" hidden>
        <div class="bundle-bar-info">
          <strong id="bundleCount">Обрано 0 товарів</strong>
          <small>Слайдшоу-Reels із фото вибраних товарів: по кадру на товар, до 6 кадрів.</small>
        </div>
        <input type="text" id="bundleTitle" placeholder="Назва добірки (необов'язково)" />
        <div class="bundle-bar-actions">
          <button type="button" class="btn ghost" id="bundleClear">Зняти вибір</button>
          <button type="button" class="btn primary" id="bundleCreate">Зібрати добірку</button>
        </div>
        <p class="bundle-message" id="bundleMessage"></p>
      </section>

      <section id="productsList" class="products-list">Завантаження...</section>
    </div>
    <footer class="legal-footer">
      <a href="/privacy.html">Privacy Policy</a>
      <a href="/terms.html">Terms of Service</a>
      <a href="/data-deletion.html">Data Deletion</a>
    </footer>
  </div>

  <script src="/products.js"></script>
</body>
</html>
